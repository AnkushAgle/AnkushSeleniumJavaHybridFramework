name: TestNG suite

on:
  push:
    branches:
      - main
      - QA
  pull_request:
    branches:
      - main
      - QA
  workflow_dispatch:

permissions:
  contents: read

jobs:
  basic-checks:
    name: Compile and package
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile and package without running tests
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

  test-suite:
    name: Run TestNG suite
    if: github.event_name != 'push'
    needs: basic-checks
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run TestNG suite from testng.xml
        run: mvn --batch-mode --no-transfer-progress test

  notify-team:
    name: Email push check result
    if: always() && github.event_name == 'push'
    needs: basic-checks
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
      TO_EMAIL: ${{ secrets.TO_EMAIL }}
      CHECK_RESULT: ${{ needs.basic-checks.result }}

    steps:
      - name: Send HTML email notification
        shell: pwsh
        run: |
          $requiredSecrets = @('FROM_EMAIL', 'EMAIL_API_KEY', 'TO_EMAIL')
          foreach ($name in $requiredSecrets) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing required GitHub Actions secret: $name"
            }
          }

          $status = $env:CHECK_RESULT
          $isSuccess = $status -eq 'success'
          $statusLabel = if ($isSuccess) { 'PASSED' } else { 'FAILED' }
          $statusColor = if ($isSuccess) { '#047857' } else { '#b91c1c' }
          $statusBackground = if ($isSuccess) { '#ecfdf5' } else { '#fef2f2' }
          $repository = [System.Net.WebUtility]::HtmlEncode($env:GITHUB_REPOSITORY)
          $branch = [System.Net.WebUtility]::HtmlEncode($env:GITHUB_REF_NAME)
          $actor = [System.Net.WebUtility]::HtmlEncode($env:GITHUB_ACTOR)
          $commit = $env:GITHUB_SHA.Substring(0, 7)
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

          $htmlBody = @"
          <!DOCTYPE html>
          <html>
          <body style="margin:0;padding:24px;background:#f3f6fb;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:640px;margin:0 auto;background:#ffffff;border:1px solid #e5eaf1;border-radius:14px;overflow:hidden;">
              <tr>
                <td style="padding:28px 32px;background:#172554;color:#ffffff;">
                  <div style="font-size:12px;letter-spacing:1.5px;color:#bfdbfe;">QA AUTOMATION · PUSH CHECK</div>
                  <h1 style="margin:12px 0 0;font-size:25px;line-height:1.3;">$(if ($isSuccess) { '&#9989; Basic checks passed' } else { '&#10060; Basic checks failed' })</h1>
                </td>
              </tr>
              <tr>
                <td style="padding:28px 32px;">
                  <p style="margin:0 0 20px;font-size:15px;line-height:1.6;">Hello Team,<br>The push verification has completed. Test cases are not run on push.</p>
                  <div style="display:inline-block;padding:8px 14px;border-radius:20px;background:$statusBackground;color:$statusColor;font-size:12px;font-weight:bold;letter-spacing:1px;">$statusLabel</div>
                  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin-top:22px;border-collapse:collapse;">
                    <tr><td style="padding:10px 0;border-bottom:1px solid #e5e7eb;color:#64748b;">Repository</td><td style="padding:10px 0;border-bottom:1px solid #e5e7eb;text-align:right;font-weight:bold;">$repository</td></tr>
                    <tr><td style="padding:10px 0;border-bottom:1px solid #e5e7eb;color:#64748b;">Branch</td><td style="padding:10px 0;border-bottom:1px solid #e5e7eb;text-align:right;font-weight:bold;">$branch</td></tr>
                    <tr><td style="padding:10px 0;border-bottom:1px solid #e5e7eb;color:#64748b;">Commit</td><td style="padding:10px 0;border-bottom:1px solid #e5e7eb;text-align:right;font-weight:bold;">$commit</td></tr>
                    <tr><td style="padding:10px 0;color:#64748b;">Pushed by</td><td style="padding:10px 0;text-align:right;font-weight:bold;">$actor</td></tr>
                  </table>
                  <p style="margin:24px 0 0;text-align:center;">
                    <a href="$runUrl" style="display:inline-block;padding:12px 20px;border-radius:8px;background:#2563eb;color:#ffffff;text-decoration:none;font-weight:bold;">View GitHub Actions run</a>
                  </p>
                </td>
              </tr>
              <tr><td style="padding:18px 32px;background:#f8fafc;text-align:center;font-size:12px;color:#64748b;">Automated notification from Ankush Selenium Java Hybrid Framework</td></tr>
            </table>
          </body>
          </html>
          "@

          $message = [System.Net.Mail.MailMessage]::new()
          $client = [System.Net.Mail.SmtpClient]::new('smtp.gmail.com', 587)
          try {
            $message.From = [System.Net.Mail.MailAddress]::new($env:FROM_EMAIL)
            foreach ($recipient in ($env:TO_EMAIL -split '[,;]')) {
              if (-not [string]::IsNullOrWhiteSpace($recipient)) {
                $message.To.Add($recipient.Trim())
              }
            }
            if ($message.To.Count -eq 0) {
              throw 'TO_EMAIL must contain at least one recipient address.'
            }

            $message.Subject = "[$statusLabel] QA push checks - $env:GITHUB_REPOSITORY ($env:GITHUB_REF_NAME)"
            $message.Body = $htmlBody
            $message.IsBodyHtml = $true
            $message.BodyEncoding = [System.Text.Encoding]::UTF8
            $message.SubjectEncoding = [System.Text.Encoding]::UTF8
            $message.Priority = [System.Net.Mail.MailPriority]::Normal

            $smtpPassword = $env:EMAIL_API_KEY -replace '\s', ''
            $securePassword = ConvertTo-SecureString $smtpPassword -AsPlainText -Force
            $credential = [System.Management.Automation.PSCredential]::new($env:FROM_EMAIL, $securePassword)
            $client.EnableSsl = $true
            $client.Credentials = $credential.GetNetworkCredential()
            $client.Send($message)
            Write-Host "HTML push-check notification sent to the configured team recipients."
          }
          finally {
            $message.Dispose()
            $client.Dispose()
          }
